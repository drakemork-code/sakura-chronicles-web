kind = "web"
previewPath = "/"
title = "Sakura Chronicles"
version = "1.0.0"
id = "artifacts/sakura-chronicles"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26197

[services.development]
run = "pnpm --filter @workspace/sakura-chronicles run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sakura-chronicles", "run", "build" ]
publicDir = "artifacts/sakura-chronicles/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26197"
BASE_PATH = "/"
